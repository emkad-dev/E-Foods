name: CI

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Lint / Build / Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck admin web
        run: npm --prefix apps/admin-web run typecheck

      - name: Typecheck partner
        run: npm run typecheck:partner

      - name: Typecheck customer
        run: npm run typecheck:customer

      - name: Typecheck dispatch
        run: npm run typecheck:dispatch

      - name: Lint customer
        run: npm run lint:customer

      - name: Lint partner
        run: npm run lint:partner

      - name: Lint dispatch
        run: npm run lint:dispatch

      - name: Build partner web (expo export)
        run: npm run build:partner

      # Pinned to the exact version this gate was validated against. A
      # floating v2.x here would let a new Deno point release shift deno
      # check's own lib.d.ts and change the type-error set for reasons
      # unrelated to any change in this repo - exactly the kind of
      # unrelated-PR breakage the fingerprint gate below exists to prevent.
      # Bump deliberately (and regenerate scripts/deno-check-baseline.txt if
      # the error set moves) rather than loosening this back to v2.x.
      - name: Use Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.3'

      # Type-checks every supabase/functions/**/index.ts entrypoint plus
      # dispatchSelection.ts (an orphaned module with zero importers - see
      # scripts/check-deno-types.mjs for why it needs listing explicitly)
      # against a committed baseline of exact error fingerprints (file:line:
      # code), not just a count - see scripts/check-deno-types.mjs's header
      # for why a count alone lets a fixed error and a new error cancel out
      # undetected. app-rpc's domain modules have never type-checked (206
      # pre-existing errors, reconciled from 210 during the Task 1 app-rpc
      # split; +6 from dispatchSelection.ts = 212 error occurrences / 193
      # unique locations - see scripts/deno-check-baseline.txt). The
      # npm:@supabase/supabase-js@2 specifier reachable from this graph is
      # pinned by package-lock.json (installed above via `npm ci`), not by a
      # deno lockfile - see scripts/check-deno-types.mjs's header for why a
      # deno.lock was tried here and removed (it turned out not to be
      # consulted once node_modules/ exists).
      - name: Deno type check (supabase/functions)
        run: node scripts/check-deno-types.mjs

      # Runs test:node then test:deno (see root package.json). Deno coverage
      # is 11 of 12 supabase/functions/**/*.test.ts files -- auth-gateway/
      # otp.test.ts is excluded because importing it triggers a module-level
      # throw from _shared/client.ts (SUPABASE_URL/SERVICE_ROLE_KEY required)
      # unrelated to the test assertions themselves; see fixwave report.
      - name: Unit tests
        run: npm test
