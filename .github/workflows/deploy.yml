name: Deploy

on:
  push:
    branches: [ 'main' ]

jobs:
  deploy:
    name: Deploy backend updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # The supabase CLI is a devDependency, so it lives in node_modules/.bin,
          # which Actions does not put on PATH for `run:` steps. Every invocation
          # must go through npx or it fails with "supabase: command not found".
          npx supabase --version
          npx supabase login --token "$SUPABASE_ACCESS_TOKEN"
          npx supabase functions deploy app-rpc payment-verification paystack-webhook public-catalog --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Deploy Cloudflare Worker (feasty-hooks)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 04c8ec7606adc0e0b391c2914fc2e429
          # wrangler-action defaults to wrangler 3.90.0, which has no global
          # --cwd flag and needs --experimental-json-config to read the
          # wrangler.jsonc files these Workers use. Both are standard in v4.
          wranglerVersion: '4.116.0'
          command: deploy --cwd cloudflare/hooks

      - name: Report Cloudflare Worker deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 04c8ec7606adc0e0b391c2914fc2e429
          # wrangler-action defaults to wrangler 3.90.0, which has no global
          # --cwd flag and needs --experimental-json-config to read the
          # wrangler.jsonc files these Workers use. Both are standard in v4.
          wranglerVersion: '4.116.0'
          command: deployments status --name feasty-hooks

      - name: Deploy Cloudflare Worker (feasty-edge-cache)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 04c8ec7606adc0e0b391c2914fc2e429
          # wrangler-action defaults to wrangler 3.90.0, which has no global
          # --cwd flag and needs --experimental-json-config to read the
          # wrangler.jsonc files these Workers use. Both are standard in v4.
          wranglerVersion: '4.116.0'
          command: deploy --cwd cloudflare/edge-cache

      - name: Report Cloudflare Worker deployment (edge-cache)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 04c8ec7606adc0e0b391c2914fc2e429
          # wrangler-action defaults to wrangler 3.90.0, which has no global
          # --cwd flag and needs --experimental-json-config to read the
          # wrangler.jsonc files these Workers use. Both are standard in v4.
          wranglerVersion: '4.116.0'
          command: deployments status --name feasty-edge-cache

      - name: Web deploys
        run: echo "Cloudflare Pages handles admin, partner, customer, and public web deploys from GitHub."

      # Web apps are hosted on Cloudflare Pages and deployed by the
      # path-filtered workflows deploy-web-landing.yml (feasty-web),
      # deploy-admin.yml (feasty-admin), and deploy-partner.yml
      # (feasty-partner). Pages' own git-integration CI is not used - its
      # build environment can't fit Metro's heap requirement.

      - name: Notify
        run: echo "Deploy steps finished (check logs for details)."
