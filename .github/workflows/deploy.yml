name: Deploy

on:
  push:
    branches: [ 'main' ]

jobs:
  deploy:
    name: Deploy backend updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci --ignore-scripts

      # This list is FOUR functions, and that is deliberate as of 2026-08-06 -
      # do not add the other eleven. This workflow has no `paths:` filter, so
      # it runs on every push to main; the eleven functions absent here each
      # have their own path-filtered workflow instead (deploy-feasty-*.yml for
      # the five split RPC domains, plus deploy-{auth-gateway,notifications,
      # broadcast-runner,queue-drainer,order-placement,unsubscribe}.yml).
      #
      # The two sets are disjoint and together cover all 15 deployable
      # functions. Keep them disjoint: adding a path-filtered function here
      # would deploy it twice, concurrently, on exactly the pushes that change
      # it - this unfiltered workflow and that function's own workflow both
      # racing `supabase functions deploy <fn>` with no `concurrency:` guard
      # anywhere in .github/workflows. Both check out the same commit so the
      # bytes match, but it burns double the CI and can fail one of the two
      # runs on a concurrent-deploy conflict, reddening main for no reason.
      #
      # History, so this isn't re-litigated a third time: the four names below
      # were never revisited as functions were added, which read as an
      # oversight rather than a decision (see
      # .superpowers/sdd/2026-08-02-glovo-parity/task-4-report.md §2). It was
      # a real gap - six functions were redeployed by nothing at all - but it
      # was closed in 5c22ed5 with path-filtered workflows, which are strictly
      # more precise than extending this list. The safety blocker is also gone:
      # 0574883 declared verify_jwt for unsubscribe/broadcast-runner/
      # order-placement in supabase/config.toml, so a `--use-api` deploy can no
      # longer silently flip their JWT enforcement.
      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # The supabase CLI is a devDependency, so it lives in node_modules/.bin,
          # which Actions does not put on PATH for `run:` steps. Every invocation
          # must go through npx or it fails with "supabase: command not found".
          npx supabase --version
          npx supabase login --token "$SUPABASE_ACCESS_TOKEN"
          npx supabase functions deploy app-rpc payment-verification paystack-webhook public-catalog --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Deploy Cloudflare Worker (feasty-hooks)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 04c8ec7606adc0e0b391c2914fc2e429
          # wrangler-action defaults to wrangler 3.90.0, which has no global
          # --cwd flag and needs --experimental-json-config to read the
          # wrangler.jsonc files these Workers use. Both are standard in v4.
          wranglerVersion: '4.116.0'
          command: deploy --cwd cloudflare/hooks

      - name: Report Cloudflare Worker deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 04c8ec7606adc0e0b391c2914fc2e429
          # wrangler-action defaults to wrangler 3.90.0, which has no global
          # --cwd flag and needs --experimental-json-config to read the
          # wrangler.jsonc files these Workers use. Both are standard in v4.
          wranglerVersion: '4.116.0'
          command: deployments status --name feasty-hooks

      - name: Deploy Cloudflare Worker (feasty-edge-cache)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 04c8ec7606adc0e0b391c2914fc2e429
          # wrangler-action defaults to wrangler 3.90.0, which has no global
          # --cwd flag and needs --experimental-json-config to read the
          # wrangler.jsonc files these Workers use. Both are standard in v4.
          wranglerVersion: '4.116.0'
          command: deploy --cwd cloudflare/edge-cache

      - name: Report Cloudflare Worker deployment (edge-cache)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 04c8ec7606adc0e0b391c2914fc2e429
          # wrangler-action defaults to wrangler 3.90.0, which has no global
          # --cwd flag and needs --experimental-json-config to read the
          # wrangler.jsonc files these Workers use. Both are standard in v4.
          wranglerVersion: '4.116.0'
          command: deployments status --name feasty-edge-cache

      - name: Web deploys
        run: echo "Cloudflare Pages handles admin, partner, customer, and public web deploys from GitHub."

      # Web apps are hosted on Cloudflare Pages and deployed by the
      # path-filtered workflows deploy-web-landing.yml (feasty-web),
      # deploy-admin.yml (feasty-admin), and deploy-partner.yml
      # (feasty-partner). Pages' own git-integration CI is not used - its
      # build environment can't fit Metro's heap requirement.

      - name: Notify
        run: echo "Deploy steps finished (check logs for details)."
