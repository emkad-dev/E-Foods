name: Deploy queue-drainer

# Path-filtered per-function deploy. Additive - closes a gap where
# queue-drainer (like every function importing _shared) had nothing
# redeploying it on a _shared/** change: it isn't on deploy.yml's
# unconditional list (deliberately left alone here - see task-4-report.md
# for why that list wasn't touched) and had no dedicated workflow of its
# own, same as five other functions fixed alongside this one.
#
# queue-drainer/index.ts imports two other functions' handler code directly
# (not through _shared): ../order-placement/handler.ts and
# ../payment-verification/handler.ts. Both directories are in the path
# filter below for that reason - a handler.ts change in either one, without
# a change under queue-drainer/** or _shared/**, would otherwise silently
# leave a stale queue-drainer running against a shape it no longer matches.
# Concrete failure this prevents: a queue.ts payload shape change lands via
# feasty-orders (redeployed by its own workflow) while queue-drainer stays
# on the old handler.ts contract and starts failing to dequeue - on the
# money path, with no CI signal.
on:
  push:
    branches: [ 'main' ]
    paths:
      - 'supabase/functions/queue-drainer/**'
      - 'supabase/functions/order-placement/**'
      - 'supabase/functions/payment-verification/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-queue-drainer.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy queue-drainer Edge Function
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Deploy queue-drainer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # The supabase CLI is a devDependency, so it lives in node_modules/.bin,
          # which Actions does not put on PATH for `run:` steps. Every invocation
          # must go through npx or it fails with "supabase: command not found".
          npx supabase --version
          npx supabase login --token "$SUPABASE_ACCESS_TOKEN"
          npx supabase functions deploy queue-drainer --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
